<!DOCTYPE html>
<html>
    <head>
        <title>Present or Absent</title>
        <script src="presentORAbsent.js"></script>
    </head>
    <body>
        <h2>Attendence Register</h2>
        <label for="lblName">Name</label>
        <input id="txtName" type="text" placeholder="Enter student name"><br>
        <label for="lblIsPresent">Is Present</label>
        <input id="txtYes" name="attendence" type="radio" value="1" >Yes
        <input id="txtNo" name="attendence" type="radio" value="0">No
        <br>
        <button id="btnSubmit" onclick="onClickSubmit()">Submit</button>
        <p id="pResult"></p>
        <hr>
         <h2>Attendence Register</h2>
        <label for="lblNames">Name</label>
        <input id="txtNames" type="text" placeholder="Enter student name">
        <label for="lblIsPresents">Is Present</label>
        <input id="txtYess" name="attendences" type="radio" value="yes" >Yes
        <input id="txtNoo" name="attendences" type="radio" value="no">No
        <button id="btnSubmits" onclick="onClickSubmits()">Submit</button>
    </body>
</html>
