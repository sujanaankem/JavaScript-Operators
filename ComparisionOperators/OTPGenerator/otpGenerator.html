<!DOCTYPE html>
<html>
    <head>
        <title>OTP Generation</title>
        <meta charset="UTF-8">
        <script src="otpGenerator.js"></script>
    </head>
    <body>
        <h2>OTP Generation:</h2>
        <p>Click here to generate the OTP:</p>
        <button id="btnOTP" onclick="onClickSendOTP()">Send OTP</button>
        <label for="lblOTP">Enter OTP:</label>
        <input id="txtOTP" placeholder="Enter your OTP" type="number">
        <button id="btnInputOTP" onclick="onClickInputOTP()">Submit OTP</button>
        <p id="pResult"></p>
    </body>
</html>
