<!DOCTYPE html>
<html>

<head>
    <title>Addition and Subtraction Assignment Operator</title>
    <script src="addAndSubAssignmentOperators.js"></script>
</head>

<body>
    <h2>Addition and Subtraction Assignment Operator</h2>
    <label for="lblNumber">Number</label>
    <input id="txtNumber" type="number" placeholder="Enter a number">
    <button id="btnIncrement" onclick="onClickAdd()">+</button>
    <button id="btnDecrement" onclick="onClickSub()">-</button>
    <button id="btnMultiplication" onclick="onClickMultiplication()">*</button>
    <button id="btnDivision" onclick="onClickDivision()">/</button>
    <p id="pResult"></p>
</body>

</html>
